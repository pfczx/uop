<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UOP Dev Playground</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0b0f19; color: #e2e8f0; }
    header { background: #111827; padding: 1rem 2rem; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    h1 { font-size: 1rem; margin: 0; color: #38bdf8; letter-spacing: 0.05em; text-transform: uppercase; }
    .app-status { display: flex; gap: 1rem; align-items: center; font-size: 0.8rem; color: #94a3b8; flex-wrap: wrap; }
    .pill { background: #1f2937; border: 1px solid #374151; border-radius: 999px; padding: 0.15rem 0.6rem; }
    .pill .val { color: #22d3ee; font-weight: 700; }
    main { max-width: 1300px; margin: 0 auto; padding: 1.5rem; display: grid; grid-template-columns: 340px 1fr; gap: 1rem; }
    .sidebar { display: flex; flex-direction: column; gap: 1rem; height: fit-content; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .card h2 { margin: 0; font-size: 0.85rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid #1f2937; padding-bottom: 0.4rem; }
    .control-row { display: flex; flex-direction: column; gap: 0.5rem; }
    .control-row.inline { flex-direction: row; gap: 0.5rem; align-items: center; }
    label { display: block; font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 0.2rem; }
    input, select { width: 100%; padding: 0.5rem 0.7rem; background: #0b1120; border: 1px solid #374151; color: #e2e8f0; border-radius: 6px; font-size: 0.9rem; }
    select { cursor: pointer; }
    .control-row.inline input, .control-row.inline select { width: auto; flex: 1 1 0; min-width: 60px; max-width: 180px; }
    button { width: 100%; padding: 0.55rem 0.9rem; background: #2563eb; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    button:hover { background: #3b82f6; }
    button.secondary { background: #374151; }
    button.secondary:hover { background: #4b5563; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #ef4444; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .resp { margin-top: 0.5rem; padding: 0.5rem; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.68rem; white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow-y: auto; border-radius: 6px; }
    .resp.ok { background: #064e3b; color: #86efac; border: 1px solid #10b981; }
    .resp.err { background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }
    .resp.hidden { display: none; }
    .muted { color: #94a3b8; font-size: 0.75rem; }
    .empty { color: #6b7280; font-size: 0.8rem; text-align: center; padding: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #1f2937; }
    th { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; }
    tr:hover { background: #1f2937; }
    .badge { display: inline-block; font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 600; }
    .badge.green { background: #065f46; color: #a7f3d0; }
    .badge.red { background: #7f1d1d; color: #fecaca; }
    .badge.blue { background: #1e3a8a; color: #bfdbfe; }
  </style>
</head>
<body>
  <header>
    <h1>UOP Dev Playground</h1>
    <div class="app-status">
      <div class="pill">Users <span class="val" id="statUsers">-</span></div>
      <div class="pill">Workspaces <span class="val" id="statWorkspaces">-</span></div>
      <div class="pill">Monitors <span class="val" id="statMonitors">-</span></div>
      <div class="pill">Batches <span class="val" id="statBatches">-</span></div>
    </div>
  </header>
  <main>
    <div class="sidebar">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Test Connection</div>
        </div>
        <button onclick="callApi('GET','/ping',null,'respPing')">Test Ping</button>
        <div class="resp hidden" id="respPing"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Status</div>
        </div>
        <button class="secondary" onclick="refresh()">Refresh All</button>
        <div class="resp hidden" id="respStatus"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Clear Database</div>
        </div>
        <button class="danger" onclick="callApi('DELETE','/clear',null,'respClear')">Wipe Everything</button>
        <div class="resp hidden" id="respClear"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Add User</div>
        </div>
        <input id="uEmail" placeholder="alice@example.com" />
        <input id="uPass" type="password" placeholder="password" value="password123" />
        <select id="uRole"><option>USER</option><option>ADMIN</option></select>
        <button onclick="callApi('POST','/users',{email:get('uEmail'),password:get('uPass'),role:get('uRole')},'respUser')">Create User</button>
        <div class="resp hidden" id="respUser"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Add Workspace</div>
        </div>
        <input id="wName" placeholder="Demo Workspace" />
        <input id="wDesc" placeholder="Description" />
        <button onclick="callApi('POST','/workspaces',{name:get('wName'),description:get('wDesc')},'respWs')">Create Workspace</button>
        <div class="resp hidden" id="respWs"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Add Monitor</div>
        </div>
        <label>Workspace</label><select id="selWs"></select>
        <input id="mName" placeholder="Monitor Name" />
        <button onclick="addMonitor()">Create Monitor</button>
        <div class="resp hidden" id="respMon"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Observations</div>
        </div>
        <label>Monitor</label><select id="selMon"></select>
        <div class="control-row inline">
          <input id="oMetric" value="cpu.usage" placeholder="metric" />
          <input id="oValue" type="number" value="42" />
        </div>
        <button onclick="sendObs()">Send Observation</button>
        <div class="resp hidden" id="respObs"></div>

        <label>Bulk</label>
        <div class="control-row inline">
          <input id="bMetric" value="cpu.usage" placeholder="metric" />
          <select id="bMode"><option value="fixed">Fixed</option><option value="random">Random</option></select>
          <input id="bMin" type="number" value="0" step="any" placeholder="min" />
          <input id="bMax" type="number" value="100" step="any" placeholder="max" />
          <input id="bBatches" type="number" value="1" placeholder="batches" />
          <input id="bPerBatch" type="number" value="100" placeholder="per batch" />
        </div>
        <button onclick="bulkObs()">Generate Bulk</button>
        <div class="resp hidden" id="respBulk"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:1rem;">
      <div class="card">
        <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Workspaces</div>
        <div id="listWs" class="empty">Loading...</div>
      </div>

      <div class="card">
        <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Monitors</div>
        <div id="listMon" class="empty">Loading...</div>
      </div>

      <div class="card">
        <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;">Observations</div>
        <div class="control-row inline" style="margin-bottom:0.5rem;">
          <select id="selMonObs" onchange="loadObs()"></select>
          <button class="secondary" onclick="loadObs()">Refresh</button>
        </div>
        <div id="listObs" class="empty">Select a monitor to see observations</div>
      </div>
    </div>
  </main>

  <script>
    const API = '/api/dev';

    function get(id){ return document.getElementById(id).value; }

    function callApi(method, path, body, respId) {
      const el = document.getElementById(respId);
      el.className = 'resp';
      el.style.display = 'block';
      el.textContent = 'Calling ' + method + ' ' + path + '...';

      const opts = { method, credentials: 'same-origin' };
      if (body) {
        const fd = new URLSearchParams();
        for (const [k,v] of Object.entries(body)) {
          if (v !== null && v !== undefined && v !== '') fd.append(k, String(v));
        }
        opts.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
        opts.body = fd.toString();
      }

      fetch(API + path, opts)
        .then(async res => {
          const text = await res.text();
          let parsed;
          try { parsed = JSON.parse(text); } catch { parsed = text; }
          el.className = 'resp ' + (res.ok ? 'ok' : 'err');
          el.textContent = (res.ok ? '[OK] ' : '[ERROR] ') + res.status + ' ' + path + '\n' + JSON.stringify(parsed, null, 2);
          if (res.ok) setTimeout(refresh, 300);
        })
        .catch(err => {
          el.className = 'resp err';
          el.textContent = '[NETWORK ERROR] ' + err.message;
          console.error(err);
        });
    }

    async function refresh(){
      const r = await callApiRaw('GET','/status');
      if (r.ok && r.data) {
        const d = r.data;
        document.getElementById('statUsers').textContent = d.users;
        document.getElementById('statWorkspaces').textContent = d.workspaces;
        document.getElementById('statMonitors').textContent = d.monitors;
        document.getElementById('statBatches').textContent = d.observationBatches;
      }
      await loadLists();
    }

    async function callApiRaw(method, path, body){
      const opts = { method, credentials: 'same-origin' };
      if (body) {
        const fd = new URLSearchParams();
        for (const [k,v] of Object.entries(body)) fd.append(k, String(v));
        opts.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
        opts.body = fd.toString();
      }
      const res = await fetch(API + path, opts);
      const text = await res.text();
      let parsed;
      try { parsed = JSON.parse(text); } catch { parsed = text; }
      return { ok: res.ok, status: res.status, data: parsed };
    }

    async function loadLists(){
      const rw = await callApiRaw('GET','/workspaces');
      if (rw.ok) {
        const ws = rw.data;
        const html = ws.length ? ws.map(w => `<div style="padding:0.4rem;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;"><div><div style="font-weight:600">${w.name}</div><div style="font-size:0.7rem;color:#94a3b8">${w.description||''}</div></div><div style="font-size:0.7rem;color:#22d3ee">${w.id}</div></div>`).join('') : '<div class="empty">No workspaces</div>';
        document.getElementById('listWs').innerHTML = html;
        document.getElementById('selWs').innerHTML = ws.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
      }

      const rm = await callApiRaw('GET','/monitors');
      if (rm.ok) {
        const ms = rm.data;
        document.getElementById('listMon').innerHTML = ms.length ? ms.map(m => `<div style="padding:0.4rem;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;"><div><div style="font-weight:600">${m.name}</div><div style="font-size:0.7rem;color:#94a3b8">${m.descriptorName||'?'} · ${m.active ? 'active' : 'inactive'}</div></div><div style="font-size:0.7rem;color:#22d3ee">${m.id}</div></div>`).join('') : '<div class="empty">No monitors</div>';
        document.getElementById('selMon').innerHTML = ms.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        document.getElementById('selMonObs').innerHTML = ms.map(m => `<option value="${m.id}">${m.name} (${m.descriptorName||'?'})</option>`).join('');
      }
    }

    async function addMonitor(){
      const wid = document.getElementById('selWs').value;
      const name = document.getElementById('mName').value;
      if (!wid) { showResp('respMon', {ok:false,status:400,data:{error:'Select a workspace'}}); return; }
      const r = await callApiRaw('POST','/monitors',{workspaceId:wid,name:name});
      showResp('respMon',r);
      if(r.ok) setTimeout(loadLists,300);
    }

    async function sendObs(){
      const mid = document.getElementById('selMon').value;
      if (!mid) { showResp('respObs',{ok:false,status:400,data:{error:'Select a monitor'}}); return; }
      const r = await callApiRaw('POST','/observations/send',{monitorId:mid,metric:get('oMetric'),value:get('oValue')});
      showResp('respObs',r);
    }

    async function bulkObs(){
      const mid = document.getElementById('selMon').value;
      if (!mid) { showResp('respBulk',{ok:false,status:400,data:{error:'Select a monitor'}}); return; }

      const body = {
        monitorId: mid,
        batches: parseInt(get('bBatches')||1),
        observationsPerBatch: parseInt(get('bPerBatch')||100),
        metric: get('bMetric'),
        mode: get('bMode')
      };
      const min = get('bMin');
      const max = get('bMax');
      if (min !== '') body.minValue = min;
      if (max !== '') body.maxValue = max;

      const r = await callApiRaw('POST','/observations/bulk',body);
      showResp('respBulk',r);
      if(r.ok) setTimeout(()=>loadObs(),300);
    }

    async function loadObs(){
      const mid = document.getElementById('selMonObs').value;
      if (!mid) { document.getElementById('listObs').innerHTML = '<div class="empty">Select a monitor</div>'; return; }

      const el = document.getElementById('listObs');
      el.innerHTML = '<div style="padding:0.5rem;"><div style="font-size:0.7rem;color:#94a3b8">Loading...</div></div>';

      try {
        const r = await callApiRaw('GET', '/observations/' + mid);
        if (r.ok && Array.isArray(r.data) && r.data.length) {
          const rows = r.data.map(o => {
            const d = new Date(o.observedAt).toLocaleString();
            return `<tr><td>${d}</td><td>${o.metric}</td><td>${o.value}</td></tr>`;
          }).join('');
          el.innerHTML = `<table><thead><tr><th>Time</th><th>Metric</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table>`;
        } else {
          el.innerHTML = '<div class="empty">No observations</div>';
        }
      } catch (err) {
        el.innerHTML = '<div class="resp err">Error loading observations</div>';
        console.error(err);
      }
    }

    function showResp(id,r){
      const el = document.getElementById(id);
      el.className = 'resp ' + (r.ok ? 'ok' : 'err');
      el.style.display = 'block';
      el.textContent = (r.ok ? '[OK] ' : '[ERROR] ') + r.status + '\n' + JSON.stringify(r.data,null,2);
    }

    refresh();
  </script>
</body>
</html>
