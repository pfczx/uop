services:

  postgres:
    image: postgres:17
    container_name: uop-dev-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5433:5432"

    volumes:
      - uop-dev-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-uop}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  uop-dev-postgres-data:
