name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test uop-agent-sdk
        run: ./mvnw -T 1C -B -pl uop-agent-sdk -am verify
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-sdk
          path: "**/target/jacoco.exec"
          if-no-files-found: ignore

  test-collectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test uop-agent-collectors
        run: ./mvnw -T 1C -B -pl uop-agent-collectors -am verify
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-collectors
          path: "**/target/jacoco.exec"
          if-no-files-found: ignore

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test uop-backend
        run: ./mvnw -T 1C -B -pl uop-backend -am verify -DexcludedGroups=e2e
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: "**/target/jacoco.exec"
          if-no-files-found: ignore

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test uop-backend e2e
        run: ./mvnw -T 1C -B -pl uop-backend -am verify -Dgroups=e2e
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-e2e
          path: "**/target/jacoco.exec"
          if-no-files-found: ignore

  coverage:
    needs: [test-sdk, test-collectors, test-backend, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          path: jacoco-exec
      - name: Stage jacoco.exec files into module target dirs
        run: |
          find jacoco-exec -name 'jacoco.exec' -print0 \
            | while IFS= read -r -d '' f; do
                module=$(echo "$f" | sed -E 's#jacoco-exec/[^/]+/(uop-[^/]+)/.*#\1#')
                if [ -d "$module" ]; then
                  mkdir -p "$module/target"
                  cp "$f" "$module/target/jacoco.exec"
                fi
              done
      - name: Compile modules (no tests)
        run: ./mvnw -T 1C -B verify -DskipTests
      - name: Merge exec files and generate combined coverage (printed to log)
        run: |
          set -e
          curl -sSL -o /tmp/jacoco.zip \
            https://repo1.maven.org/maven2/org/jacoco/jacoco/0.8.12/jacoco-0.8.12.zip
          unzip -q /tmp/jacoco.zip -d /tmp/jacoco
          CLI=$(find /tmp/jacoco -name 'jacococli.jar' | head -1)
          echo "Using JaCoCo CLI: $CLI"

          EXEC_FILES=()
          while IFS= read -r -d '' f; do EXEC_FILES+=("$f"); done \
            < <(find . -name jacoco.exec -not -path './jacoco-exec/*' -print0)
          CLASS_ARGS=()
          while IFS= read -r -d '' d; do
            # Skip generated protobuf classes (uop-proto): 0% coverable, would
            # drag the combined number down. Matches the Maven JaCoCo excludes.
            case "$d" in *uop-proto*) continue;; esac
            CLASS_ARGS+=(--classfiles "$d")
          done < <(find . -type d -path '*/target/classes' -print0)

          java -jar "$CLI" merge "${EXEC_FILES[@]}" --destfile /tmp/jacoco-merged.exec
          java -jar "$CLI" report /tmp/jacoco-merged.exec "${CLASS_ARGS[@]}" \
            --xml /tmp/jacoco-combined.xml

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/jacoco-combined.xml').getroot()
          counters = {c.get('type'): c for c in root.findall('counter')}
          print("\n===== Combined JaCoCo Coverage =====")
          for t in ('INSTRUCTION', 'BRANCH', 'LINE', 'METHOD', 'CLASS'):
              c = counters.get(t)
              if c is None:
                  continue
              missed = int(c.get('missed')); covered = int(c.get('covered'))
              total = missed + covered
              pct = (covered / total * 100) if total else 0.0
              print(f"{t:<12}: {pct:6.2f}% ({covered}/{total})")

          # Per-class line coverage, lowest first (what's not covered).
          # Skip packages the Maven JaCoCo config excludes (dto/config/exception/
          # enums/demo) so the list shows real uncovered code, not noise.
          EXCL = ('dto/', 'config/', 'exception/', 'enums/', '/demo/', 'proto/')
          def line_pct(el):
              for c in el.findall('counter'):
                  if c.get('type') == 'LINE':
                      m = int(c.get('missed')); cov = int(c.get('covered')); tot = m + cov
                      return (cov / tot * 100) if tot else 100.0
              return 100.0
          rows = []
          for pkg in root.findall('package'):
              for cls in pkg.findall('class'):
                  name = cls.get('name')
                  if any(x in name for x in EXCL):
                      continue
                  rows.append((line_pct(cls), name))
          rows.sort()
          print("\n===== Lowest-covered classes (by line %, excl. DTO/config/exception/enum/demo) =====")
          for pct, name in rows[:20]:
              print(f"{pct:6.2f}%  {name.replace('/', '.')}")
          print("===================================\n")
          PY

