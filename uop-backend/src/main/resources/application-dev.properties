# =============================================================================
# UOP Dev Profile — Docker Postgres (prod-like) + Swagger + Actuator
# Run: ./dev.sh   (starts postgres:17 via docker-compose, then Spring Boot)
# The dev profile is activated by ./dev.sh via -Dspring-boot.run.profiles=dev
# =============================================================================

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:uop}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Security — relaxed for dev experimentation
app.security.csrf-enabled=false
app.bootstrap.admin.enabled=false

# Demo data seed on startup
app.demo.seed.enabled=true

# Actuator — inspect the running system
management.endpoints.web.exposure.include=health,beans,mappings,info,env,metrics
management.endpoint.health.show-details=always
management.server.port=8081

# Swagger UI — dev only, http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.platform.uop

# Agent installer / platform URLs
installer-url=http://localhost:8081/agent/install
platform-url=http://localhost:8080
registration-token-lifetime=PT15M
