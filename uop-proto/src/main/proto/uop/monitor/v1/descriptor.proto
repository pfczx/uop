// template for creating the structure of transmitted data and monitor properties

syntax = "proto3";

package uop.monitor.v1;

option java_multiple_files = true;
option java_package = "com.platform.uop.monitor.v1";

message MonitorDescriptor {
    string id = 1;
    string name = 2;
    string description = 3;
    string version = 4;
    bool active = 5;

    repeated MetricDescriptor metrics = 6;

    repeated ConfigurationEntry entries = 7;

}

message MetricDescriptor {
    string name = 1;
    string description = 2;

    ValueType value_type = 3;
    MetricType metric_type = 4;

    string unit = 5;
}

enum ValueType {
    VALUE_TYPE_UNSPECIFIED = 0;

    VALUE_TYPE_INT64 = 1;
    VALUE_TYPE_UINT64 = 2;
    VALUE_TYPE_DOUBLE = 3;
    VALUE_TYPE_BOOL = 4;
    VALUE_TYPE_STRING = 5;
}

enum MetricType {
    METRIC_TYPE_UNSPECIFIED = 0;

    METRIC_TYPE_GAUGE = 1;
    METRIC_TYPE_COUNTER = 2;
    METRIC_TYPE_STATE = 3;
    METRIC_TYPE_INFO = 4;
}

message MonitorConfiguration {
    repeated ConfigurationEntry entries = 1;
}

message ConfigurationEntry {
    string key = 1;
    ConfigurationValue value = 2;
}

message ConfigurationValue {
    oneof value {
        string string_value = 1;
        int64 int_value = 2;
        uint64 uint_value = 3;
        double double_value = 4;
        bool bool_value = 5;
    }
}


