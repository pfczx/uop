# Testcontainers configuration (committed so local and CI behave the same).
#
# Reuse containers across JVMs/runs: the shared Postgres (see
# AbstractPostgresIntegrationTest) stays up between `mvn test` invocations, so
# local reruns skip the boot + Flyway migration. On fresh CI runners there is
# nothing to reuse, so this is effectively a no-op there.
testcontainers.reuse.enable=true

# Skip the registry "does this image exist?" check on every container start.
# Avoids network latency and works when offline / no registry access.
check.disable=true