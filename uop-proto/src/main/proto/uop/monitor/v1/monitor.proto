syntax = "proto3";

package uop.monitor.v1;

import "uop/monitor/v1/descriptor.proto";
import "uop/monitor/v1/configuration.proto";
import "uop/monitor/v1/observation.proto";
import "uop/monitor/v1/health.proto";

option java_multiple_files = true;
option java_package = "com.platform.uop.monitor.v1";

service MonitorService {

    rpc GetDescriptor(GetDescriptorRequest)
        returns (MonitorDescriptor);

    rpc Configure(ConfigureRequest)
        returns (ConfigureResponse);

    rpc Export(ExportRequest)
        returns (ExportResponse);

    rpc Health(HealthRequest)
        returns (HealthResponse);
}

message GetDescriptorRequest {
}
