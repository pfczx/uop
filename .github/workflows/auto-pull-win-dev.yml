name: Auto Pull & Restart Spring

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, win-dev]

    steps:
      - name: Pull latest code
        shell: powershell
        run: |
          cd C:\uop
          git pull

      - name: Kill old Spring
        shell: powershell
        run: |
          Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Run Spring
        shell: powershell
        run: |
          cd C:\uop
          mvn spring-boot:run
