name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test uop-agent-sdk
        run: ./mvnw -T 1C -B -pl uop-agent-sdk -am verify
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-sdk
          path: "**/target/jacoco.exec"
          if-no-files-found: ignore

  test-collectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test uop-agent-collectors
        run: ./mvnw -T 1C -B -pl uop-agent-collectors -am verify
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-collectors
          path: "**/target/jacoco.exec"
          if-no-files-found: ignore

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test uop-backend
        run: ./mvnw -T 1C -B -pl uop-backend -am verify -DexcludedGroups=e2e
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: "**/target/jacoco.exec"
          if-no-files-found: ignore

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test uop-backend e2e
        run: ./mvnw -T 1C -B -pl uop-backend -am verify -Dgroups=e2e
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-e2e
          path: "**/target/jacoco.exec"
          if-no-files-found: ignore

  coverage:
    needs: [test-sdk, test-collectors, test-backend, test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          path: jacoco-exec
      - name: Stage jacoco.exec files into module target dirs
        run: |
          find jacoco-exec -name 'jacoco.exec' -print0 \
            | while IFS= read -r -d '' f; do
                module=$(echo "$f" | sed -E 's#jacoco-exec/[^/]+/(uop-[^/]+)/.*#\1#')
                if [ -d "$module" ]; then
                  mkdir -p "$module/target"
                  cp "$f" "$module/target/jacoco.exec"
                fi
              done
      - name: Compile modules (no tests)
        run: ./mvnw -T 1C -B verify -DskipTests
      - name: Generate combined coverage report (all modules)
        # report-aggregate bound to verify runs first in the reactor (before any
        # exec data exists), so invoke it explicitly now that all exec is staged.
        run: ./mvnw -B org.jacoco:jacoco-maven-plugin:0.8.12:report-aggregate
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-combined-report
          path: '**/target/site/jacoco-aggregate/**'
          if-no-files-found: warn

