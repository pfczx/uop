name: Auto Pull & Restart Spring

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, win-dev]

    steps:
      - name: Pull latest code
        shell: powershell
        run: |
          cd C:\uop
          git pull

      - name: Rebuild and restart containers
        shell: powershell
        run: |
          cd C:\uop
          $env:SPRING_PROFILES_ACTIVE="dev"
          docker compose down -v
          docker compose up -d --build
      - name: Wait for application
        shell: powershell
        run: |
          $maxAttempts = 100 
          for ($i = 0; $i -lt $maxAttempts; $i++) {

          if (Test-NetConnection localhost -Port 8080 -InformationLevel Quiet) { 
            Write-Host "Application is ready" 
            exit 0 
          }

            Start-Sleep -Seconds 5 
          } 
          Write-Error "Application failed to start" 
          docker compose logs 
          exit 1
